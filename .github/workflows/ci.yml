name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aura:
    name: aura (RN app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aura/package-lock.json
      - name: Provision env.ts
        run: cp src/env.example.ts src/env.ts
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci --passWithNoTests

  functions:
    name: functions (Cloud Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
